<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Production analytics architecture</title>
<desc>Seven-stage pipeline: Raw sources flow through Staging, Clean, and Golden layers, then Feature and Metrics layers, into an Executive Dashboard, with a Data Quality and Monitoring layer running alongside every stage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="20" y="20" width="640" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Raw sources</text>
<text x="340" y="60" text-anchor="middle" font-size="12" fill="#5F5E5A">17 source tables — CDC / batch export from operational systems</text>

<line x1="340" y1="76" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="20" y="102" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="90" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Staging</text>
<text x="90" y="140" text-anchor="middle" font-size="12" fill="#185FA5">Raw, append-only</text>
</g>
<g>
<rect x="180" y="102" width="140" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="250" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Clean</text>
<text x="250" y="140" text-anchor="middle" font-size="12" fill="#185FA5">Dedup, type-cast</text>
</g>
<g>
<rect x="340" y="102" width="140" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="410" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Golden</text>
<text x="410" y="140" text-anchor="middle" font-size="12" fill="#0F6E56">Entity-resolved</text>
</g>
<g>
<rect x="500" y="102" width="160" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="580" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Feature</text>
<text x="580" y="140" text-anchor="middle" font-size="12" fill="#0F6E56">Agent/account rollups</text>
</g>

<line x1="160" y1="128" x2="178" y2="128" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="128" x2="338" y2="128" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="128" x2="498" y2="128" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="580" y1="154" x2="580" y2="180" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M580 180 L580 200 L410 200 L410 208" fill="none" stroke="#0F6E56" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="210" width="300" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="410" y="230" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Metrics layer</text>
<text x="410" y="248" text-anchor="middle" font-size="12" fill="#854F0B">Contact/RPC/PTP/recovery rates, monthly</text>
</g>

<line x1="410" y1="262" x2="410" y2="288" stroke="#854F0B" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="220" y="290" width="380" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="410" y="310" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Executive dashboard</text>
<text x="410" y="328" text-anchor="middle" font-size="12" fill="#993C1D">One screen, refreshed daily</text>
</g>

<rect x="20" y="370" width="640" height="130" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="40" y="392" font-size="14" font-weight="500" fill="#791F1F">Data quality &amp; monitoring (runs alongside every stage)</text>
<text x="40" y="414" font-size="12" fill="#A32D2D">Contracts: primary keys enforced at Staging→Clean; late-arriving events reprocessed via 7-day rolling backfill window</text>
<text x="40" y="432" font-size="12" fill="#A32D2D">Checks: row-count deltas, duplicate-rate thresholds, null-rate thresholds, disposition-code drift alerts</text>
<text x="40" y="450" font-size="12" fill="#A32D2D">Anomaly detection: month-over-month metric z-score &gt; 2 flags for manual review before dashboard refresh</text>
<text x="40" y="468" font-size="12" fill="#A32D2D">Lineage: every Metrics-layer field traces to its Golden-layer source table and cleaning rule (see SQL repository)</text>
<text x="40" y="486" font-size="12" fill="#A32D2D">Incremental processing: daily partition by event_at; backfills reprocess only affected partitions</text>
</svg>
